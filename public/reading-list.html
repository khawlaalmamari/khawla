<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة القراءة الشخصية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes card-out {
      to { opacity: 0; transform: scale(0.94); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .card-in  { animation: card-in 0.35s cubic-bezier(.2,.8,.2,1) both; }
    .card-out { animation: card-out 0.25s ease-in forwards; }
    .shake    { animation: shake 0.3s ease-in-out; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">

    <!-- Header -->
    <header class="mb-8 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">📚 قائمة القراءة الشخصية</h1>
        <p class="mt-1 text-slate-400">Personal Reading-List — تابع الكتب التي تقرؤها والتي أنهيتها.</p>
      </div>
    </header>

    <!-- Stats -->
    <section class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
        <p class="text-sm text-slate-400">إجمالي الكتب</p>
        <p id="stat-total" class="mt-1 text-3xl font-semibold transition-all">0</p>
      </div>
      <div class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-5">
        <p class="text-sm text-amber-300/80">قيد القراءة · Reading</p>
        <p id="stat-reading" class="mt-1 text-3xl font-semibold text-amber-300">0</p>
      </div>
      <div class="rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-5">
        <p class="text-sm text-emerald-300/80">تمت القراءة · Completed</p>
        <p id="stat-completed" class="mt-1 text-3xl font-semibold text-emerald-300">0</p>
      </div>
    </section>

    <!-- Add form -->
    <form id="add-form" class="mb-3 flex flex-col gap-3 sm:flex-row" novalidate>
      <label for="book-input" class="sr-only">عنوان الكتاب</label>
      <input
        id="book-input"
        type="text"
        maxlength="120"
        autocomplete="off"
        placeholder="اكتب عنوان الكتاب..."
        class="flex-1 rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 placeholder-slate-500 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/40"
      />
      <button
        type="submit"
        class="rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white shadow-lg shadow-indigo-900/40 transition hover:bg-indigo-500 active:scale-95"
      >
        + إضافة كتاب
      </button>
    </form>
    <p id="error-msg" class="mb-6 h-5 text-sm text-rose-400" role="alert" aria-live="polite"></p>

    <!-- Book grid -->
    <section id="book-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></section>

    <p id="empty-state" class="hidden rounded-2xl border border-dashed border-slate-800 p-10 text-center text-slate-500">
      لا توجد كتب بعد — أضف أول كتاب لتبدأ.
    </p>
  </div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "reading-list:v1";
      const MAX_LEN = 120;

      const form = document.getElementById("add-form");
      const input = document.getElementById("book-input");
      const list = document.getElementById("book-list");
      const errorMsg = document.getElementById("error-msg");
      const emptyState = document.getElementById("empty-state");
      const statTotal = document.getElementById("stat-total");
      const statReading = document.getElementById("stat-reading");
      const statCompleted = document.getElementById("stat-completed");

      // Visual styles per state (applied instantly on toggle).
      const STATE_STYLES = {
        reading: {
          card: ["border-amber-500/40", "bg-amber-500/10", "shadow-amber-900/20"],
          badge: ["bg-amber-500/20", "text-amber-300"],
          badgeText: "قيد القراءة · Reading",
          btn: ["bg-emerald-600", "hover:bg-emerald-500"],
          btnText: "✓ تمت القراءة",
        },
        completed: {
          card: ["border-emerald-500/50", "bg-emerald-500/10", "shadow-emerald-900/20"],
          badge: ["bg-emerald-500/20", "text-emerald-300"],
          badgeText: "تمت القراءة · Completed",
          btn: ["bg-amber-600", "hover:bg-amber-500"],
          btnText: "↺ إعادة للقراءة",
        },
      };
      const ALL_CARD = [...STATE_STYLES.reading.card, ...STATE_STYLES.completed.card];
      const ALL_BADGE = [...STATE_STYLES.reading.badge, ...STATE_STYLES.completed.badge];
      const ALL_BTN = [...STATE_STYLES.reading.btn, ...STATE_STYLES.completed.btn];

      let books = loadBooks();

      /* ---------- Input sanitization ---------- */

      // Cleans raw text and returns { ok, value, error }.
      function sanitizeTitle(raw) {
        if (typeof raw !== "string") return { ok: false, error: "إدخال غير صالح." };

        let value = raw
          .normalize("NFKC")
          .replace(/[\u0000-\u001F\u007F-\u009F​-‏‪-‮⁦-⁩]/g, "") // control & bidi chars
          .replace(/\s+/g, " ")
          .trim();

        if (!value) return { ok: false, error: "لا يمكن إضافة عنوان فارغ." };

        // Reject markup / script-like content outright.
        const dangerous = /<[^>]*>|<|>|javascript\s*:|data\s*:|vbscript\s*:|on\w+\s*=|&#|\{\{|\}\}/i;
        if (dangerous.test(value)) {
          return { ok: false, error: "العنوان يحتوي على رموز غير مسموح بها." };
        }

        if (value.length > MAX_LEN) {
          return { ok: false, error: `العنوان طويل جداً (الحد الأقصى ${MAX_LEN} حرفاً).` };
        }

        const duplicate = books.some((b) => b.title.toLowerCase() === value.toLowerCase());
        if (duplicate) return { ok: false, error: "هذا الكتاب موجود بالفعل في القائمة." };

        return { ok: true, value };
      }

      /* ---------- Persistence (best effort) ---------- */

      function loadBooks() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(parsed)) return [];
          // Re-validate stored data; never trust it blindly.
          return parsed
            .filter((b) => b && typeof b.id === "string" && typeof b.title === "string")
            .map((b) => ({
              id: b.id,
              title: b.title.slice(0, MAX_LEN),
              status: b.status === "completed" ? "completed" : "reading",
            }));
        } catch {
          return [];
        }
      }

      function saveBooks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        } catch {
          /* storage unavailable — keep working in memory */
        }
      }

      /* ---------- Rendering (DOM APIs only, no innerHTML) ---------- */

      function applyState(card, status) {
        const s = STATE_STYLES[status];
        card.dataset.status = status;
        card.classList.remove(...ALL_CARD);
        card.classList.add(...s.card);

        const badge = card.querySelector("[data-role=badge]");
        badge.classList.remove(...ALL_BADGE);
        badge.classList.add(...s.badge);
        badge.textContent = s.badgeText;

        const title = card.querySelector("[data-role=title]");
        title.classList.toggle("line-through", status === "completed");
        title.classList.toggle("text-slate-400", status === "completed");

        const btn = card.querySelector("[data-role=toggle]");
        btn.classList.remove(...ALL_BTN);
        btn.classList.add(...s.btn);
        btn.textContent = s.btnText;
        btn.setAttribute("aria-pressed", String(status === "completed"));
      }

      function createCard(book, animate) {
        const card = document.createElement("article");
        card.dataset.id = book.id;
        card.className =
          "flex flex-col justify-between gap-4 rounded-2xl border-2 p-5 shadow-lg transition-colors duration-500 ease-out";
        if (animate) card.classList.add("card-in");

        const top = document.createElement("div");
        top.className = "flex items-start justify-between gap-3";

        const title = document.createElement("h3");
        title.dataset.role = "title";
        title.className = "break-words text-lg font-semibold leading-snug transition-colors duration-500";
        title.textContent = book.title; // textContent => no HTML parsing

        const del = document.createElement("button");
        del.type = "button";
        del.dataset.role = "delete";
        del.className =
          "shrink-0 rounded-lg px-2 text-slate-500 transition hover:bg-rose-500/10 hover:text-rose-400";
        del.setAttribute("aria-label", "حذف الكتاب");
        del.textContent = "✕";

        top.append(title, del);

        const bottom = document.createElement("div");
        bottom.className = "flex items-center justify-between gap-3";

        const badge = document.createElement("span");
        badge.dataset.role = "badge";
        badge.className = "rounded-full px-3 py-1 text-xs font-medium transition-colors duration-500";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.dataset.role = "toggle";
        toggle.className =
          "rounded-lg px-3 py-2 text-sm font-medium text-white transition-all duration-300 active:scale-95";

        bottom.append(badge, toggle);
        card.append(top, bottom);

        applyState(card, book.status);
        return card;
      }

      function renderAll() {
        list.replaceChildren(...books.map((b) => createCard(b, true)));
        updateStats();
      }

      function updateStats() {
        const completed = books.filter((b) => b.status === "completed").length;
        statTotal.textContent = books.length;
        statReading.textContent = books.length - completed;
        statCompleted.textContent = completed;
        emptyState.classList.toggle("hidden", books.length > 0);
      }

      function showError(msg) {
        errorMsg.textContent = msg;
        input.classList.remove("shake");
        void input.offsetWidth; // restart animation
        input.classList.add("shake", "border-rose-500");
      }

      function clearError() {
        errorMsg.textContent = "";
        input.classList.remove("border-rose-500");
      }

      function newId() {
        return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
      }

      /* ---------- Events ---------- */

      form.addEventListener("submit", (e) => {
        e.preventDefault(); // no page reload
        const result = sanitizeTitle(input.value);
        if (!result.ok) return showError(result.error);

        const book = { id: newId(), title: result.value, status: "reading" };
        books.unshift(book);
        saveBooks();
        list.prepend(createCard(book, true));
        updateStats();

        input.value = "";
        clearError();
        input.focus();
      });

      input.addEventListener("input", clearError);

      // Event delegation for toggle / delete buttons.
      list.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-role]");
        if (!btn) return;
        const card = btn.closest("article");
        const book = books.find((b) => b.id === card.dataset.id);
        if (!book) return;

        if (btn.dataset.role === "toggle") {
          book.status = book.status === "reading" ? "completed" : "reading";
          applyState(card, book.status);
          saveBooks();
          updateStats();
        } else if (btn.dataset.role === "delete") {
          books = books.filter((b) => b.id !== book.id);
          saveBooks();
          card.classList.remove("card-in");
          card.classList.add("card-out");
          card.addEventListener("animationend", () => { card.remove(); updateStats(); }, { once: true });
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
